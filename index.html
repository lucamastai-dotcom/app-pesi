<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pesi Crew">
<meta name="theme-color" content="#14192b">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Diario Pesi Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: schermata di accesso, poi 4 tab (Esercizi, Sessioni, Amici, Scheda). Arancio e blu notte. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#14192b; --muted:#667089; --line:#e1e4ec;
  --accent:#f26a1b; --accent-ink:#ffffff; --up:#1a8f55; --down:#c2410c; --navy:#14192b; --err:#c2410c;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --surface:#171d31; --ink:#eef0f7; --muted:#97a0b8; --line:#2a3250;
    --accent:#ff7d33; --accent-ink:#1a0d03; --up:#4ade80; --down:#fb923c; --navy:#0a0e1a; --err:#fb923c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#171d31; --ink:#eef0f7; --muted:#97a0b8; --line:#2a3250;
  --accent:#ff7d33; --accent-ink:#1a0d03; --up:#4ade80; --down:#fb923c; --navy:#0a0e1a; --err:#fb923c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px)}
body.noauth{padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-family:var(--font-display);font-size:32px;line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.hbtns{display:flex;gap:6px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:8px 0 16px;position:sticky;top:6px;z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--font-body);padding:10px 4px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 6px}
label.l:first-child{margin-top:0}
input,select{width:100%;font:16px var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;font:600 16px var(--font-body);padding:12px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:18px}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.group-t{font-family:var(--font-display);font-size:20px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.group-t b{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 9px;font-weight:700}
.ex{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.ex .n{font-weight:600}
.ex .m{font-size:13px;color:var(--muted)}
.ex .kg{font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ex .kg small{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.d{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.d.up{color:var(--up)} .d.down{color:var(--down)} .d.eq{color:var(--muted)}
.sess .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess .h b{font-family:var(--font-display);font-size:20px}
.pill{display:inline-flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;margin:6px 6px 0 0;font-variant-numeric:tabular-nums}
.pill em{font-style:normal;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
.overlay{position:fixed;inset:0;background:rgba(10,14,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.sheet h2{font-family:var(--font-display);font-size:26px;margin:0 0 2px}
.chart{width:100%;height:auto;display:block;margin:10px 0}
.hist{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
.kgwrap{position:relative}
.kgwrap input{padding-right:34px;text-align:right;font-variant-numeric:tabular-nums}
.kgwrap i{position:absolute;right:10px;top:11px;font-style:normal;color:var(--muted);font-size:14px}
.prow{display:grid;grid-template-columns:1fr 92px 36px;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--font-body);padding:8px 2px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.feed{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.feed:first-child{border-top:0}
.who{font-weight:600;background:none;border:0;color:var(--ink);padding:0;font:600 16px var(--font-body);cursor:pointer;text-align:left}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .pos{font-family:var(--font-display);font-size:24px;width:26px;color:var(--muted)}
.rank:nth-of-type(1) .pos{color:var(--accent)}
.rank .nm{flex:1}
.rank .kg{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.gcard .gt{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.exe{border-top:1px solid var(--line);padding:10px 0 4px}
.exe:first-of-type{border-top:0}
.exr{display:flex;gap:8px;align-items:center}
.rx3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px;margin-top:8px}
.exr input,.gt input{min-width:0;flex:1}
.mv{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:6px 6px;line-height:1}
.mv:disabled{opacity:.25;cursor:default}
.gcard,#v-sc{max-width:100%;overflow-x:hidden}
.rx3 label{font-size:11px;font-weight:600;color:var(--muted);display:block}
.rx3 input{margin-top:3px;padding:8px 10px;font-size:15px}
/* Chip, punteggio, premi, procedura guidata */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 14px var(--font-body);cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.score{display:inline-flex;align-items:baseline;gap:4px;border:1.5px solid currentColor;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:600;white-space:nowrap}
.score b{font-family:var(--font-display);font-size:20px;line-height:1}
.score.t0{color:var(--up)} .score.t1{color:var(--accent)} .score.t2{color:var(--down)} .score.t3{color:var(--err)}
.score.t4{color:var(--ink);background:var(--navy);border-color:var(--navy);color:#fff}
.score.t4 b{color:var(--accent)}
.fcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--ink);font:inherit;cursor:pointer}
.fcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.fcard .nm{font-family:var(--font-display);font-size:22px}
.award{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.award .ah{display:flex;gap:12px;align-items:center}
.award .ai{font-size:32px;line-height:1}
.award .at{font-family:var(--font-display);font-size:22px;line-height:1.05}
.award .as{font-size:12px;color:var(--muted)}
.award .aw{font-family:var(--font-display);font-size:28px;color:var(--accent);margin:8px 0 2px;line-height:1.1}
.award .ad{font-size:14px}
.award .af{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.wk{font-family:var(--font-display);font-size:20px;margin:16px 0 8px}
.wk small{font-family:var(--font-body);font-size:13px;color:var(--muted);margin-left:6px}
.plist .pe{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.plist .pe:first-of-type{border-top:0}
.plist .pe{align-items:center}
.plist .pe .pt{display:flex;flex-direction:column;min-width:0;gap:1px}
.plist .pe .pb{display:flex;gap:6px;flex:0 0 auto}
.ic{width:40px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:17px;cursor:pointer;padding:0;color:var(--ink)}
.ic.on{background:var(--accent);border-color:var(--accent)}
.plist .pe span:last-child{color:var(--muted);white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
/* Scheda: giornate richiudibili e tasto rapido */
.gh{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:0;margin:14px 0 8px;font-family:var(--font-display);font-size:20px;color:var(--ink);cursor:pointer;text-align:left}
.gh b{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 9px;font-weight:700}
.gh .gtx{display:flex;flex-direction:column;line-height:1.1}
.gh .gs,.group-t .gs{font:500 12px var(--font-body);color:var(--muted);text-transform:capitalize}
.gh .cnt{margin-left:auto;font:500 13px var(--font-body);color:var(--muted);white-space:nowrap}
.gh .cnt i{font-style:normal;font-size:16px;margin-left:4px}
.exw{display:flex;gap:6px;margin-bottom:8px}
.exw .ex{margin-bottom:0;flex:1;min-width:0}
.qk{flex:0 0 52px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font:700 22px var(--font-body);cursor:pointer}
.qk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exa{display:flex;gap:8px;margin:18px 0 6px}
.sech{margin:22px 2px 6px;font:600 13px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sech:first-child{margin-top:12px}
.exa .btn{flex:1}
/* Timer (tab Pausa, per ora nascosto) */
.tbar{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:14px;border-top:3px solid var(--accent);padding:12px 14px;margin:10px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tbar .tlabel{font-family:var(--font-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbar .tlabel small{font-family:var(--font-body);font-size:16px;opacity:.7;margin-left:4px}
.tbar .tin{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px}
.tbar button{border:0;border-radius:999px;font:600 16px var(--font-body);padding:9px 14px;min-width:52px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
.tbar button.on{background:var(--accent);color:var(--accent-ink)}
.tbar #t-stop{background:transparent;border:1px solid rgba(255,255,255,.35);padding:11px 16px;font-size:15px}
.tbar #t-stop[hidden]{display:none}
.tbar .tprog{position:absolute;left:0;right:0;top:0;height:3px}
.tbar .tprog i{display:block;height:100%;width:0;background:var(--accent)}
.tbar[data-state="done"]{background:var(--accent);color:var(--accent-ink)}
.tbar[data-state="done"] button{background:rgba(0,0,0,.16);color:var(--accent-ink)}
.tbar[data-state="done"] #t-stop{border-color:rgba(0,0,0,.4)}
.tbar[data-state="done"] .tprog i{background:transparent}
@media (prefers-reduced-motion: no-preference){
  .tbar[data-state="done"]{animation:flash .6s ease-in-out 4}@keyframes flash{50%{filter:brightness(1.35)}}
  .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
[hidden]{display:none!important}
</style>
</head>
<body class="noauth">

<div class="wrap" id="auth" hidden>
  <header><div><h1>Diario <span>Pesi</span> Crew</h1><div class="sub">I carichi tuoi e dei tuoi amici, in palestra.</div></div></header>
  <div class="card">
    <div class="seg" id="auth-seg">
      <button type="button" class="on" data-mode="login">Entra</button>
      <button type="button" data-mode="register">Crea profilo</button>
    </div>
    <label class="l" for="a-name">Nome</label>
    <input id="a-name" autocomplete="username" autocapitalize="words" maxlength="24">
    <label class="l" for="a-pass">Password</label>
    <input id="a-pass" type="password" autocomplete="current-password" maxlength="60">
    <div id="reg-extra" hidden>
      <label class="l" for="a-code">Codice amici</label>
      <input id="a-code" autocapitalize="none" autocomplete="off">
      <label class="l" for="a-tpl">Scheda di partenza</label>
      <select id="a-tpl">
        <option value="sample">Scheda di esempio (divisa per gruppo muscolare)</option>
        <option value="empty">Scheda vuota, la creo io</option>
      </select>
    </div>
    <button class="btn full" id="a-go" type="button" style="margin-top:16px">Entra</button>
    <div class="err" id="a-err" role="alert"></div>
  </div>
  <div class="card" id="api-setup" hidden>
    <label class="l" for="api-url">Indirizzo del backend (Apps Script)</label>
    <input id="api-url" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="none" autocomplete="off">
    <div class="sub">Mancante nel file. Incollalo qui per provare, oppure scrivilo in API_URL dentro index.html.</div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div><h1>Diario <span>Pesi</span></h1><div class="sub" id="who"></div></div>
    <div class="hbtns">
      <button class="btn ghost small" id="b-refresh" type="button" aria-label="Aggiorna">Aggiorna</button>
      <button class="btn ghost small" id="b-logout" type="button">Esci</button>
      <button class="btn ghost small" id="b-set" type="button" aria-label="Impostazioni" style="padding-left:10px;padding-right:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <nav role="tablist">
    <button role="tab" id="t-ex" aria-selected="true" data-tab="ex">Scheda</button>
    <button role="tab" id="t-ses" aria-selected="false" data-tab="ses">Sessioni</button>
    <button role="tab" id="t-fr" aria-selected="false" data-tab="fr">Amici</button>
    <button role="tab" id="t-sc" aria-selected="false" data-tab="sc" hidden>Modifica</button>
  </nav>

  <section id="v-ex">
    <div class="quote" style="margin:4px 2px 0;text-align:center;text-wrap:balance;font:italic 600 15px/1.35 var(--font-display);color:var(--accent)">«Il tuo fisico non riflette le tue intenzioni, racconta le tue abitudini.»</div>
    <div id="trend"></div>
    <div class="exa"><button class="btn ghost small" type="button" data-exa="edit">Modifica scheda</button><button class="btn small" type="button" data-exa="wizard">Genera scheda</button><button class="btn ghost small" type="button" id="ex-sb" aria-label="Cerca un esercizio" style="flex:0 0 auto;padding-left:12px;padding-right:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="display:block"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div>
    <input type="search" id="ex-q" placeholder="Cerca esercizio…" aria-label="Cerca esercizio" autocomplete="off" hidden style="margin:2px 0 6px">
    <div id="ex-list"></div>
  </section>
  <section id="v-ses" hidden><div id="ses-list"></div></section>
  <section id="v-fr" hidden></section>
  <section id="v-sc" hidden></section>
  <div class="status" id="status"></div>
</div>

<div class="overlay" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
"use strict";

/* ====== IMPOSTAZIONI ====== */
// Indirizzo dell'app web di Apps Script (finisce con /exec).
var API_URL = "https://script.google.com/macros/s/AKfycbzy6M-EFJ6Z2vRoVZNcQ0rlNqPTuxdnEyJvzewpEfzXDt0tVRGwd1ydnlwaORaCGp0axw/exec";

/* ====== Libreria esercizi ====== */
// [nome, gruppo muscolare, attrezzo (m macchina, c cavi, d manubri, b bilanciere), livello tecnico 1-3, composto 1/0]
var MG=["Petto","Schiena","Spalle","Bicipiti","Tricipiti","Quadricipiti","Femorali","Glutei","Polpacci","Addome"];
var EQN={m:"macchina",c:"cavi",d:"manubri",b:"bilanciere"};
var UPPER={Petto:1,Schiena:1,Spalle:1,Bicipiti:1,Tricipiti:1};
var LIBRAW=[
  ["Chest press","Petto","m",1,1],["Panca piana con manubri","Petto","d",2,1],["Panca piana con bilanciere","Petto","b",3,1],
  ["Panca inclinata con manubri","Petto","d",2,1],["Pec deck","Petto","m",1,0],["Croci ai cavi","Petto","c",2,0],["Croci con manubri","Petto","d",2,0],

function rx(e){
  var t="";
  if(e.s&&e.r) t=e.s+" × "+e.r;
  if(e.rec!==undefined&&e.rec!==""&&e.rec!==null) t+=(t?" · ":"")+"rec "+e.rec+" s";
  return t;
}
function exMin(s,rec){return s*(45+Math.max(rec,60))/60;} // 45 s di esecuzione + riposo (minimo 60 s) per ogni serie
function dayMin(exs){var m=10;exs.forEach(function(e){m+=exMin(+e.s>0?+e.s:3,(e.rec!==undefined&&e.rec!==""&&e.rec!==null&&isFinite(+e.rec))?+e.rec:75);});return m;}
function schedaStats(sch){
  var ex=0,sets=0,lvSum=0,mins=[];
  (sch||[]).forEach(function(g){
    if(!g.ex||!g.ex.length||isRoutine(g)) return;
    var m=10;
    g.ex.forEach(function(e){
      var s=+e.s>0?+e.s:3;
      var rec=(e.rec!==undefined&&e.rec!==""&&e.rec!==null&&isFinite(+e.rec))?+e.rec:75;
      var lb=libOf(e.n);
      var lv=+e.lv||(lb?lb.lv:1.5);
      ex++;sets+=s;lvSum+=lv;m+=exMin(s,rec);
    });
    mins.push(m);
  });
  if(!ex) return null;
  var F=mins.length;
  var D=mins.reduce(function(a,b){return a+b;},0)/F;
  var T=lvSum/ex;
  var sc=0.5+clamp((sets-12)/108,0,1)*3.5+clamp((F-1)/4,0,1)*1.5+clamp((D-25)/65,0,1)*2+clamp((T-1)/2,0,1)*2;
  sc=clamp(sc,1,10);
  var tier=sc<=3.4?0:sc<=5.4?1:sc<=7.4?2:sc<=8.9?3:4;
  return {score:sc,tier:tier,label:["Facile","Media","Impegnativa","Dura","Da Arnold"][tier],sessions:F,exercises:ex,sets:sets,minutes:Math.round(D)};
}

  return '<span class="score t'+st.tier+'"><b>'+fmt1(st.score)+'</b>/10 · '+st.label+'</span>';
}

  return st.sessions+(st.sessions===1?" allenamento":" allenamenti")+" a settimana · "+st.exercises+" esercizi · circa "+st.minutes+" min a seduta";
}

  polsi:/Curl con bilanciere|bilanciere EZ|French|Dip alla|Panca stretta|Panca Scott|sopra la testa|Kickback|Panca piana con bilanciere/
};
var TECH=/Stacco da terra|Good morning|Rollout/;
var genCtx={inf:[],eta:null,gym:null};
/* ====== La mia palestra: attrezzi disponibili (salvati sul telefono) ====== */
var GYM_SHARED=[["manubri","Manubri"],["bilanciere","Bilanciere con dischi"],["rack","Rack / gabbia (squat, military)"],["panca","Panca regolabile"],["cavi","Cavi (torre o doppia puleggia)"],["disco","Dischi (per il crunch)"]];
var GYM_PANCA=/Panca|inclinat|Scott|concentrato|Pullover con manubrio|Step-up|Croci con manubri|Hip thrust$|Glute bridge|Rematore su panca/;
var GYM_RACK=/Squat con bilanciere|Front squat|Military|Squat sumo con bilanciere|Panca piana con bilanciere|Panca inclinata con bilanciere|Panca stretta/;
function reqKeys(e){
  if(e.eq==="m") return [e.n];
  if(e.eq==="c") return ["cavi"];
  var k=e.n==="Crunch con disco"?["disco"]:[e.eq==="b"?"bilanciere":"manubri"];
  if(GYM_PANCA.test(e.n)) k.push("panca");
  if(e.eq==="b"&&GYM_RACK.test(e.n)) k.push("rack");
  return k;
}
function gymOkWith(e,keys){return reqKeys(e).every(function(k){return keys.indexOf(k)>-1;});}
function loadGym(){try{var a=JSON.parse(lsGet("dpc-gym")||"null");return(Array.isArray(a)&&a.length)?a:null;}catch(x){return null;}}
function etaNum(v){var n=parseInt(v,10);return(isFinite(n)&&n>=10&&n<=90)?n:null;}
function ageSoft(){return genCtx.eta!==null&&(genCtx.eta>=50||genCtx.eta<18);}
function setCtx(p){genCtx={inf:(p&&p.inf)||[],eta:etaNum(p&&p.eta),gym:(p&&p.gymOn)?loadGym():null};}
function exOut(e){
  var i;
  for(i=0;i<genCtx.inf.length;i++){var r=INJ[genCtx.inf[i]];if(r&&r.test(e.n)) return true;}
  if(ageSoft()&&TECH.test(e.n)) return true;
  if(genCtx.gym&&!gymOkWith(e,genCtx.gym)) return true;
  return false;
}
function eqOk(e,att){
  if(exOut(e)) return false;
  if(genCtx.gym) return true; // con la lista della palestra la scelta degli attrezzi è già fatta
  var g=e.eq==="m"?"m":e.eq==="c"?"c":"l"; // l = pesi liberi (manubri e bilanciere)
  return !att||!att.length||att.indexOf(g)>-1;
}
function pickEx(mg,post,occ,used,usedPlan,p){
  var base=LIB.filter(function(e){
    if(e.mg!==mg) return false;
    if(!eqOk(e,p.att)) return false;
    if(post&&!/posteriori|Reverse|Face/.test(e.n)) return false;
    return true;
  });
  var cand=base.filter(function(e){return p.liv==="principiante"?e.lv<=2:true;});
  if(!cand.length) cand=base;
  if(!cand.length) return null;
  shuffle(cand);
  var nu=cand.filter(function(e){return !used[e.n];});
  if(!nu.length) nu=cand;
  var wantC=(occ===0);
  var tiers=[
    nu.filter(function(e){return !usedPlan[e.n]&&(!!e.c===wantC);}),
    nu.filter(function(e){return !!e.c===wantC;}),
    nu.filter(function(e){return !usedPlan[e.n];}),
    nu
  ];
  for(var i=0;i<tiers.length;i++) if(tiers[i].length) return tiers[i][0];
  return cand[0];
}
function slotClass(g,focus){
  var up=!!UPPER[g],low=!up&&g!=="Addome";
  if(focus==="alto") return up?0:(g==="Addome"?1:2);
  return low?0:(g==="Addome"?1:2);
}
function genScheda(p){
  var target=p.durata;
  wzRelaxed=false;setCtx(p);
  var avg=(function(){
    var a1=presc({c:1,mg:"Petto"},p.liv,p.obi,p.stile),a2=presc({c:0,mg:"Petto"},p.liv,p.obi,p.stile);
    return (exMin(a1.s,a1.rec)+exMin(a2.s,a2.rec))/2;
  })();
  var N=clamp(Math.round((target-10)/avg),3,12);
  var usedPlan={};
  var out=[];
  var maxEx=p.stile==="hit"?6:10,canGrow=p.stile!=="hit";
  planFor(p.stile,p.giorni).forEach(function(key,di){
    var slots=TPL[key].slice(),n=Math.min(N,maxEx),tgt=target;
    if(!FULLK[key]&&p.focus!=="totale"){
      var up=!!TUPPER[key];
      tgt=target+(((p.focus==="alto")===up)?6:-6);
    }else if(FULLK[key]&&p.focus!=="totale"){
      var idx=slots.map(function(s,i){return {s:s,i:i,c:slotClass(s.replace("*",""),p.focus)};});
      idx.sort(function(a,b){return a.c-b.c||a.i-b.i;});
      var sorted=idx.map(function(x){return x.s;}).slice(0,n);
      var need=n>=6?2:1;
      var isOpp=function(s){var g=s.replace("*","");return p.focus==="alto"?(!UPPER[g]&&g!=="Addome"):(!!UPPER[g]);};
      var have=sorted.filter(isOpp).length;
      if(have<need){
        var extras=TPL[key].filter(function(s){return isOpp(s);});
        for(var k=0;k<need-have&&k<extras.length;k++) sorted[sorted.length-1-k]=extras[k];
      }
      slots=sorted;
    }
    var cnt={},used={},exs=[];
    function slotAt(i){return i<slots.length?slots[i]:TPL[key][i%TPL[key].length];}
    function addOne(){
      var slot=slotAt(exs.length);
      var post=slot.indexOf("*")>-1,mg=slot.replace("*","");
      var occ=cnt[slot]||0;
      var e=pickEx(mg,post,occ,used,usedPlan,p);
      if(!e||usedPlan[e.n]){
        var alt=LIB.filter(function(x){return x.mg===mg&&!usedPlan[x.n]&&eqOk(x,p.att);});
        if(!alt.length){ // nessun esercizio con gli attrezzi scelti per questo gruppo: uso l'attrezzo più vicino
          alt=LIB.filter(function(x){return x.mg===mg&&!used[x.n]&&!exOut(x);});
          if(alt.length) wzRelaxed=true;
        }
        if(!alt.length) alt=LIB.filter(function(x){return !usedPlan[x.n]&&eqOk(x,p.att)&&(UPPER[x.mg]?!!UPPER[mg]:!UPPER[mg]);});
        e=alt.length?alt[Math.floor(Math.random()*alt.length)]:null;
      }
      if(!e){
        // esercizi finiti: riuso uno già presente in altre giornate (mai due volte nella stessa)
        var re=LIB.filter(function(x){return !used[x.n]&&eqOk(x,p.att)&&(x.mg===mg||(UPPER[x.mg]?!!UPPER[mg]:!UPPER[mg]));});
        re.sort(function(a1,b1){return (b1.mg===mg)-(a1.mg===mg);});
        e=re.length?re[0]:null;
      }
      if(!e) return false;
      cnt[slot]=occ+1;
      used[e.n]=1;usedPlan[e.n]=1;
      var pr=presc(e,p.liv,p.obi,p.stile);
      exs.push({id:uid(),n:e.n,mg:e.mg,lv:e.lv,s:pr.s,r:pr.r,rec:pr.rec,_slot:slot});
      return true;
    }
    function dropOne(){
      var e=exs.pop();
      delete used[e.n];delete usedPlan[e.n];cnt[e._slot]--;
    }
    for(var i=0;i<n;i++) if(!addOne()) break;
    // porto la durata stimata il più vicino possibile a quella scelta
    var guard=0;
    while(exs.length<maxEx&&guard++<12){
      var m0=dayMin(exs);
      if(!addOne()) break;
      var m1=dayMin(exs);
      if(Math.abs(m1-tgt)<Math.abs(m0-tgt)) continue;
      dropOne();break;
    }
    guard=0;
    while(exs.length>3&&guard++<12){
      var m2=dayMin(exs),last=exs[exs.length-1];
      var m3=m2-exMin(+last.s,+last.rec);
      if(Math.abs(m3-tgt)<Math.abs(m2-tgt)) dropOne(); else break;
    }
    // sedute lunghe: se non bastano gli esercizi, aggiungo una serie ai principali
    guard=0;
    while(canGrow&&dayMin(exs)<tgt-6&&guard++<40){
      var grown=false;
      for(var gi=0;gi<exs.length&&dayMin(exs)<tgt-3;gi++){if(exs[gi].s<(ageSoft()?3:4)){exs[gi].s++;grown=true;}}
      if(!grown) break;
    }
    // sedute brevissime: se anche con 3 esercizi si sfora, tolgo una serie dagli ultimi
    guard=0;
    while(dayMin(exs)>tgt+4&&guard++<20){
      var cut=false;
      for(var ci=exs.length-1;ci>=0&&dayMin(exs)>tgt+2;ci--){if(exs[ci].s>2){exs[ci].s--;cut=true;}}
      if(!cut) break;
    }
    exs.forEach(function(e){delete e._slot;});
    out.push({id:uid(),t:"Giornata "+(di+1),ex:exs});
  });
  return out;
}

var S={token:"",me:"",users:[],log:[]}; // log: {u,d,e,kg}
var mode="login";
var lastSync=0;

function apiUrl(){return API_URL||lsGet("dpc-api")||"";}
function api(action,payload){
  var url=apiUrl();
  if(!url) return Promise.reject(new Error("Manca l'indirizzo del backend."));
  var body=JSON.stringify(Object.assign({action:action,token:S.token},payload||{}));
  var to=new Promise(function(_,rej){setTimeout(function(){rej(new Error("connessione lenta, riprova"));},25000);});
  return Promise.race([fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body}).then(function(r){return r.json();}),to])
    .then(function(j){if(!j||!j.ok) throw new Error((j&&j.error)||"Errore del server"); return j;});
}
function setStatus(t){$("status").textContent=t||"";}
function applyState(j){
  S.me=j.me;
  S.users=(j.users||[]).map(function(u){return {name:u.name,scheda:Array.isArray(u.scheda)?u.scheda:[]};});
  // "Full Body A/B/C" (o "Giornata A/B/C") diventa "Giornata 1/2/3"
  var renamedMine=false,repsMig=!lsGet("dpc-reps1");
  S.users.forEach(function(u){u.scheda.forEach(function(g){
    if(repsMig) g.ex.forEach(function(e){var r2=singleReps(e.r,e.n);if(r2!==e.r){e.r=r2;if(u.name===S.me)renamedMine=true;}});
    var m=/^\s*(?:full\s*body|giornata)\s+([a-z])\s*$/i.exec(String(g.t||""));
    if(m){g.t="Giornata "+(m[1].toUpperCase().charCodeAt(0)-64);if(u.name===S.me)renamedMine=true;}
  });});
  if(renamedMine&&S.token&&j.token===undefined){
    var mine=userObj(S.me);
    if(mine) api("saveScheda",{scheda:mine.scheda,renames:[]}).then(function(){if(repsMig)lsSet("dpc-reps1","1");}).catch(function(){});
  }else if(!renamedMine&&repsMig&&S.me&&userObj(S.me)) lsSet("dpc-reps1","1");
  S.log=(j.log||[]).map(function(r){return {u:r[0],d:r[1],e:r[2],kg:r[3]};});
  lastSync=Date.now();
  curSeed();
  try{lsSet("dpc-cache",JSON.stringify({me:S.me,users:S.users,log:j.log}));}catch(e){}
}
var saveAt=0,saving=0;
function loadState(tries){
  var t0=Date.now();tries=tries||0;
  return api("state").then(function(j){
    if(saving>0||saveAt>=t0){ // risposta partita prima di un salvataggio: sarebbe vecchia, riprovo
      if(tries<8) return new Promise(function(r){setTimeout(r,800);}).then(function(){return loadState(tries+1);});
      setStatus("");return;
    }
    applyState(j);$("who").textContent="Profilo di "+S.me;renderAll();setStatus("");}).catch(function(e){
    if(/scaduto/.test(e.message)){doLogout(true);return;}
    setStatus("Non riesco ad aggiornare: "+e.message);
  });
}

function curAll(){try{return JSON.parse(localStorage.getItem("dpc-cur")||"{}")||{};}catch(e){return {};}}
function curGet(name){var m=curAll()[S.me];var v=m&&m[name];return (typeof v==="number"&&v>0)?v:null;}
function curSet(name,kg){var a=curAll();a[S.me]=a[S.me]||{};if(kg>0)a[S.me][name]=kg;else delete a[S.me][name];lsSet("dpc-cur",JSON.stringify(a));}
function curSeed(){
  if(!S.me) return;
  var a=curAll(),m=a[S.me]=a[S.me]||{},ch=false,last={};
  S.log.forEach(function(x){if(x.u!==S.me||!(x.kg>0)) return;var o=last[x.e];if(!o||x.d>=o.d) last[x.e]=x;});

function history(user,name){
  return S.log.filter(function(x){return x.u===user&&x.e===name;}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
}
function lastBefore(user,name,date){
  var h=history(user,name).filter(function(x){return x.d<date;});
  return h.length?h[h.length-1]:null;
}
function applyOpsLocal(ops){
  ops.forEach(function(o){
    S.log=S.log.filter(function(x){return !(x.u===S.me&&x.d===o.date&&x.e===o.ex);});
    if(o.kg!==null&&o.kg!==undefined) S.log.push({u:S.me,d:o.date,e:o.ex,kg:o.kg});
  });
  ops.forEach(function(o){
    if(o.kg===null||o.kg===undefined) return;
    var h=history(S.me,o.ex);
    if(h.length&&h[h.length-1].d===o.date) curSet(o.ex,o.kg); // solo se è la registrazione più recente
  });
  try{lsSet("dpc-cache",JSON.stringify({me:S.me,users:S.users,log:S.log.map(function(x){return [x.u,x.d,x.e,x.kg];})}));}catch(e){}
}
var opsChain=Promise.resolve();
function sendOps(ops){
  applyOpsLocal(ops);
  renderAll();
  saving++;
  // un invio alla volta, nell'ordine in cui li fai: due salvataggi contemporanei sul foglio possono sovrascriversi
  var job=opsChain.then(function(){return api("ops",{ops:ops});});
  opsChain=job.catch(function(){});
  return job.then(function(){saving--;saveAt=Date.now();},function(e){
    saving--;saveAt=Date.now();
    setStatus("Salvataggio non riuscito ("+e.message+"). Ricarico i dati.");
    return loadState();
  });
}
function saveMyScheda(scheda,renames){
  saveAt=Date.now();saving++;
  return api("saveScheda",{scheda:scheda,renames:renames||[]}).then(function(r){saving--;saveAt=Date.now();return r;},function(e){saving--;throw e;}).then(function(){
    var me=userObj(S.me);
    if(me) me.scheda=scheda;
    (renames||[]).forEach(function(r){var cv=curAll()[S.me]&&curAll()[S.me][r.from];if(cv>0){curSet(r.to,cv);curSet(r.from,0);}});
    (renames||[]).forEach(function(r){S.log.forEach(function(x){if(x.u===S.me&&x.e===r.from) x.e=r.to;});});
    try{lsSet("dpc-cache",JSON.stringify({me:S.me,users:S.users,log:S.log.map(function(x){return [x.u,x.d,x.e,x.kg];})}));}catch(e){}
  });
}

var openG={};

// stallo: stesso peso nelle ultime 4 registrazioni, distribuite su almeno 2 settimane, ultima negli ultimi 28 giorni
function stallInfo(name){
  var h=history(S.me,name);
  if(h.length<4) return null;
  var l4=h.slice(-4),kg=l4[3].kg;
  if(!(kg>0)||l4.some(function(x){return x.kg!==kg;})) return null;
  if(dayDiff(l4[0].d,l4[3].d)<14||dayDiff(l4[3].d,iso(new Date()))>=28) return null;
  return {kg:kg};
}
function stallPlan(e,kg){
  var r=parseInt(singleReps(e.r,e.n),10);if(!isFinite(r)) r=10;
  var lb=libOf(e.n),st=lb&&lb.c?2.5:1;
  if(r>=10){var nr=r>=15?12:8;return {r:String(nr),kg:kg+st,txt:"passa a "+nr+" ripetizioni con "+fmt(kg+st)+" kg"};}
  var lw=Math.round(kg*0.9*2)/2;
  return {r:"12",kg:lw,txt:"passa a 12 ripetizioni con "+fmt(lw)+" kg"};
}
function stallHTML(e,kg){
  var pl=stallPlan(e,kg);
  return '<div class="sub" style="padding:4px 14px 8px;color:var(--accent)">⚠️ In stallo a '+fmt(kg)+' kg: prova a cambiare le ripetizioni, '+esc(pl.txt)+'. <button class="btn ghost small" type="button" data-stall="'+esc(e.n)+'" style="margin-left:4px">Imposta '+pl.r+' rip.</button></div>';
}
function stalledList(){
  var out=[];
  mySchedaObj().forEach(function(g){(g.ex||[]).forEach(function(e){var s2=stallInfo(e.n);if(s2&&out.indexOf(e.n)<0) out.push(e.n);});});
  return out;
}
function progHint(name,h){
  if(stallInfo(name)) return "";
  if(h.length<2) return "";
  var a=h[h.length-1].kg,b=h[h.length-2].kg;
  if(!(a>0)||a!==b) return "";
  var lb=libOf(name),st=lb&&lb.c?2.5:1;
  return ' · 💡 prova '+fmt(a+st)+' kg';
}
function exRow(e){
  var name=e.n,h=history(S.me,name),pr=rx(e);
  if(!h.length&&curGet(name)&&!(libOf(name)&&libOf(name).eq==="x")){
    var cw=curGet(name);
    return '<div class="exw"><button class="ex" type="button" data-ex="'+esc(name)+'"><div><div class="n">'+esc(name)+'</div><div class="m">'+(pr?esc(pr)+" · ":"")+'peso attuale · nessuna sessione registrata</div></div><div class="kg">'+fmt(cw)+' <small>kg</small></div></button>'+
      '<button class="qk" type="button" data-q="'+esc(name)+'" aria-label="Registra oggi questo peso ('+fmt(cw)+' kg)">✓</button></div>';
  }
  if(!h.length) return '<div class="exw"><button class="ex" type="button" data-ex="'+esc(name)+'" style="opacity:.8"><div><div class="n">'+esc(name)+'</div><div class="m">'+(pr?esc(pr)+" · ":"")+(libOf(name)&&libOf(name).eq==="x"?"a corpo libero":"nessun dato, tocca per aggiungere")+'</div></div><div class="kg">—</div></button></div>';
  var l=h[h.length-1],wk=curGet(name)||l.kg;
  var d=h.length>1?deltaHTML(l.kg-h[h.length-2].kg):'<span class="d eq">primo dato</span>';
  var done=(l.d===iso(new Date()));
  return '<div class="exw"><button class="ex" type="button" data-ex="'+esc(name)+'"><div><div class="n">'+esc(name)+'</div><div class="m">'+(pr?esc(pr)+" · ":"")+h.length+(h.length===1?" volta":" volte")+' · '+dshort(l.d)+progHint(name,h)+'</div></div><div class="kg">'+fmt(wk)+' <small>kg</small><div>'+d+'</div></div></button>'+
    '<button class="qk'+(done?" on":"")+'" type="button" data-q="'+esc(name)+'" aria-label="Registra oggi il peso di lavoro ('+fmt(wk)+' kg)">✓</button></div>'+(stallInfo(name)?stallHTML(e,l.kg):'');
}
/* ====== Esito andamentale ====== */
function dayDiff(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);}
function trendInfo(){
  var today=iso(new Date()),mine=S.log.filter(function(x){return x.u===S.me;});
  var dates={};mine.forEach(function(x){dates[x.d]=1;});
  var all=Object.keys(dates).sort();
  if(all.length<2) return null;
  var win=all.filter(function(d){var n=dayDiff(d,today);return n>=0&&n<28;});
  var days=mySchedaObj().filter(function(g){return g.ex&&g.ex.length&&!/^Obiettivo/.test(g.t||"")&&!isRoutine(g);}).length||3;
  var weeks=Math.min(4,Math.max(1,Math.ceil((dayDiff(all[0],today)+1)/7)));
  var r=(win.length/weeks)/days;
  var up=0,same=0,down=0;
  myExNamesAll(mine).forEach(function(n){
    var h=history(S.me,n);
    if(h.length<2) return;
    var l=h[h.length-1],pv=h[h.length-2],dd=dayDiff(l.d,today);
    if(dd<0||dd>=28) return;
    if(l.kg>pv.kg) up++;else if(l.kg<pv.kg) down++;else same++;
  });
  return {r:r,days:days,n:win.length,since:dayDiff(all[all.length-1],today),up:up,same:same,down:down,cmp:up+same+down};
}
function myExNamesAll(rows){var m={},o=[];rows.forEach(function(x){if(!m[x.e]){m[x.e]=1;o.push(x.e);}});return o;}
function stallLine(){
  var l=stalledList();if(!l.length) return '';
  var nm=l.slice(0,2).join(", ")+(l.length>2?" e altri "+(l.length-2):"");
  return '<span class="sub" style="display:block;margin-top:4px;color:var(--accent)">⚠️ In stallo: '+esc(nm)+'. Prova a cambiare le ripetizioni: i dettagli sono sotto l\'esercizio.</span>';
}
function trendHTML(){
  var t=trendInfo(),ic="💪",msg;
  if(!t) return '';
  if(t.since>=14){ic="⏰";msg="Sono passati "+t.since+" giorni dall'ultimo allenamento: riparti con calma e riprendi il ritmo.";}
  else if(t.r<0.6){ic="📈";msg="Stai andando a ritmo ridotto: aumenta la frequenza per centrare i tuoi obiettivi.";}
  else if(t.r<0.9){ic="👍";msg="Ci sei quasi: ancora qualche allenamento in più e sei in linea con la tua scheda.";}
  else if(t.cmp>=2&&t.up/t.cmp>=0.6){ic="🔥";msg="Bravo, stai progredendo coi carichi in modo costante.";}
  else if(t.cmp>=2&&t.down/t.cmp>=0.5){ic="🛌";msg="Ottima costanza, ma i carichi stanno calando: cura recupero e sonno.";}
  else if(t.cmp>=2&&t.same/t.cmp>=0.6){ic="💪";msg="Stai avendo la giusta costanza: puoi osare coi pesi.";}
  else{ic="✅";msg="Stai avendo la giusta costanza, continua così.";}
  return '<div class="card" style="margin:10px 0 4px;padding:10px 14px;display:flex;gap:10px;align-items:center"><span style="font-size:22px" aria-hidden="true">'+ic+'</span><span><b>'+esc(msg)+'</b><span class="sub" style="display:block;margin-top:2px">Ultime 4 settimane: '+t.n+(t.n===1?" allenamento":" allenamenti")+'.</span>'+stallLine()+'</span></div>';
}
function renderEx(){
  $("trend").innerHTML=trendHTML();
  var q=norm($("ex-q").value);
  var sch=mySchedaObj();
  var html="",std="",obj="",rou="";
  function isObj(g){return /^Obiettivo/.test(g.t||"");}
  sch.forEach(function(g,gi){
    var list=g.ex.filter(function(e){return !q||norm(e.n).indexOf(q)>-1;});
    if(!list.length) return;
    var key=g.id||("i"+gi),open=!!q||!!openG[key];
    var rt=isRoutine(g);
    var h='<button class="gh" type="button" data-g="'+esc(key)+'" aria-expanded="'+open+'"><b>'+esc(gBadge(g.t))+'</b><span class="gtx"><span>'+esc(g.t||"Gruppo")+'</span>'+(rt?'<span class="gs" style="text-transform:none">'+esc(doneTxt(g))+'</span>':(mgLine(g)?'<span class="gs">'+esc(mgLine(g))+'</span>':''))+'</span><span class="cnt">'+list.length+(list.length===1?" esercizio":" esercizi")+'<i>'+(open?"▾":"▸")+'</i></span></button>';
    if(open){
      if(rt){
        h+=list.map(function(e){return '<div class="exw"><div class="ex" style="cursor:default"><div><div class="n">'+esc(e.n)+'</div><div class="m">'+esc(e.s&&e.r?e.s+" × "+e.r:"")+'</div></div></div></div>';}).join("")+
          '<div style="padding:4px 2px 10px"><button class="btn'+(doneLast(g)===iso(new Date())?" ghost":"")+' full" type="button" data-rdone="'+esc(key)+'">'+(doneLast(g)===iso(new Date())?"✓ Fatta oggi (tocca per annullare)":"Fatto oggi ✓")+'</button></div>';
      }else h+=warmHTML(g)+list.map(exRow).join("");
    }
    if(rt) rou+=h;else if(isObj(g)) obj+=h;else std+=h;
  });
  if(obj||rou){
    html=(std?'<div class="sech">Scheda standard</div>'+std:'');
    if(obj) html+='<div class="sech">Schede per obiettivo</div>'+obj;
    if(rou) html+='<div class="sech">Routine extra</div>'+rou;
  }else html=std;
  if(!html){
    html=sch.length?'<div class="empty">Nessun esercizio trovato.</div>':'<div class="empty">La tua scheda è vuota.<br>Toccando Genera scheda ti propongo una scheda, oppure con Modifica scheda la scrivi tu.</div>';
  }
  $("ex-list").innerHTML=html;
}

/* ====== Grafico ====== */
function chartSVG(h){
  var W=320,H=170,L=34,R=14,T=14,B=26;
  if(h.length<2) return '<div class="empty" style="padding:18px 0">Serve almeno un secondo allenamento per vedere il grafico.</div>';
  var vals=h.map(function(x){return x.kg;});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max-min<1){min-=1;max+=1;}
  var p_=(max-min)*0.15;min=Math.floor((min-p_)*2)/2;max=Math.ceil((max+p_)*2)/2;
  var t0=pd(h[0].d).getTime(),t1=pd(h[h.length-1].d).getTime();
  function X(i){var f=t1>t0?(pd(h[i].d).getTime()-t0)/(t1-t0):i/(h.length-1);return L+f*(W-L-R);}
  function Y(v){return T+(1-(v-min)/(max-min))*(H-T-B);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del peso">';
  [min,(min+max)/2,max].forEach(function(v){
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(v)+'</text>';
  });
  var pts=h.map(function(x,i){return X(i).toFixed(1)+","+Y(x.kg).toFixed(1);});
  s+='<path d="M'+X(0).toFixed(1)+","+(H-B)+" L"+pts.join(" L")+" L"+X(h.length-1).toFixed(1)+","+(H-B)+' Z" fill="var(--accent)" opacity=".13"/>';
  s+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  h.forEach(function(x,i){
    var last=i===h.length-1;
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="'+(last?5:3)+'" fill="'+(last?"var(--accent)":"var(--surface)")+'" stroke="var(--accent)" stroke-width="2"/>';
  });
  s+='<text x="'+X(0)+'" y="'+(H-8)+'" font-size="10" fill="var(--muted)">'+dshort(h[0].d)+'</text>';
  s+='<text x="'+X(h.length-1)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+dshort(h[h.length-1].d)+'</text>';
  s+='<text x="'+X(h.length-1)+'" y="'+(Y(h[h.length-1].kg)-10)+'" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">'+fmt(h[h.length-1].kg)+' kg</text>';
  return s+'</svg>';
}

/* serie di oggi: solo su questo telefono. c = serie selezionata (1..N), N+1 = tutte fatte */
function serieState(){
  var today=iso(new Date()),o;
  try{o=JSON.parse(lsGet("dpc-serie")||"null");}catch(e){o=null;}
  if(!o||o.d!==today) o={d:today,ex:{}};
  return o;
}
function serieN(name){var eo=myExObj(name),n=eo?parseInt(eo.s,10):3;return(isFinite(n)&&n>0)?Math.min(n,8):3;}
function serieHTML(name){
  var N=serieN(name),c=serieState().ex[name]||1;
  var h='<div class="chips">';
  for(var i=1;i<=N;i++){
    var done=i<c,on=i===c;
    h+='<button type="button" class="chip'+(on?" on":"")+'" data-sr="'+i+'" aria-pressed="'+on+'" style="min-width:48px;'+(done?"opacity:.55;text-decoration:line-through":"")+'">'+(done?"✓ ":"")+i+'</button>';
  }
  return h+'</div><div class="sub" style="margin-top:6px">'+(c>N?"Tutte le serie fatte. Bravo!":"Tocca la serie per selezionarla, tocca ancora per segnarla fatta.")+'</div>';
}
function setSerie(name,k){
  var st=serieState(),N=serieN(name),c=st.ex[name]||1;
  st.ex[name]=(k===c)?c+1:k;   // tocco sulla serie arancione = fatta, passa alla successiva
  if(st.ex[name]>N+1) st.ex[name]=N+1;
  lsSet("dpc-serie",JSON.stringify(st));
  var el=$("srow");if(el) el.innerHTML=serieHTML(name);
}

  if(a==="all"){gymDraft=GYM_SHARED.map(function(x){return x[0];}).concat(LIB.filter(function(e){return e.eq==="m";}).map(function(e){return e.n;}));return renderGym();}
  if(a==="none"){gymDraft=[];return renderGym();}
  if(a==="save"){lsSet("dpc-gym",JSON.stringify(gymDraft));closeSheet();setStatus("Palestra salvata.");return;}
  if(a==="clear"){try{localStorage.removeItem("dpc-gym");}catch(x){}closeSheet();setStatus("Lista rimossa: il generatore usa di nuovo tutti gli attrezzi.");}
}

function goalsAll(){try{return JSON.parse(lsGet("dpc-goals")||"{}")||{};}catch(e){return {};}}
function goalsMine(){var o=goalsAll();return o[S.me]||{};}
function goalsPut(key,st){var o=goalsAll();o[S.me]=o[S.me]||{};if(st) o[S.me][key]=st;else delete o[S.me][key];lsSet("dpc-goals",JSON.stringify(o));}
function goalFinalIdx(g){return g.lv.length-1;}
function goalPlace(g,v){var lvl=0;g.place.forEach(function(m,i){if(m!==null&&v>=m) lvl=i;});return lvl;}
function goalR(g,lvl,v){ // ripetizioni (o secondi) per serie
  var L=g.lv[lvl];
  if(g.type==="reach") return L.st;
  if(L.fin) return Math.max(g.fin,Math.round((v||0)*0.7));
  if(v===null||v===undefined||!(v>0)) return L.st;
  return Math.min(L.up,Math.max(L.st,Math.round(v*0.8)));
}
function goalExercises(g,st){
  var L=g.lv[st.lvl],ex=[{id:uid(),n:L.n,s:3,r:String(st.r),rec:90}];
  if(st.lvl>0){var P=g.lv[st.lvl-1];ex.push({id:uid(),n:P.n,s:2,r:String(g.type==="reach"?P.st:(P.up||P.st)),rec:60});}
  return ex;
}
function goalApply(key,st){ // aggiorna (o crea) la giornata dell'obiettivo nella scheda
  var g=GOALS[key],sch=cloneScheda(mySchedaObj()),day=null;
  sch.forEach(function(d){if(d.id===st.dayId) day=d;});
  var exs=goalExercises(g,st);
  if(day) day.ex=exs;
  else{day={id:uid(),t:"Obiettivo "+g.n.toLowerCase(),ex:exs};sch.push(day);st.dayId=day.id;}
  return saveMyScheda(sch,[]);
}
function goalStart(key,v,target){
  var g=GOALS[key],lvl=goalPlace(g,v);
  var st={lvl:lvl,target:target,tests:[{d:iso(new Date()),v:v,l:lvl}],dayId:(goalsMine()[key]||{}).dayId||""};
  st.r=g.type==="reach"?g.lv[lvl].st:(g.lv[lvl].fin?Math.max(g.fin,Math.round(v*0.6)):g.lv[lvl].st);
  return st;
}
function goalRetest(key,v){
  var g=GOALS[key],st=goalsMine()[key],L=g.lv[st.lvl],msg="";
  if(g.type==="reach"){
    var nl=goalPlace(g,v);
    msg=nl>st.lvl?"Livello superato! 🎉":(v>=4?"Obiettivo raggiunto! 🎉":"Test registrato.");
    st.lvl=nl;st.r=L.st&&g.lv[nl].st;
  }else if(L.fin){
    st.r=goalR(g,st.lvl,v);
    msg=v>=st.target?"Obiettivo raggiunto! 🎉":"Test registrato: sei a "+v+" su "+st.target+".";
  }else if(v>=L.up){
    st.lvl++;st.r=g.lv[st.lvl].st;
    msg="Livello superato! 🎉 Passi a: "+g.lv[st.lvl].n+".";
  }else{
    st.r=goalR(g,st.lvl,v);
    msg="Test registrato: ti mancano "+(L.up-v)+" per passare al livello successivo.";
  }
  st.tests.push({d:iso(new Date()),v:v,l:st.lvl});
  goalsPut(key,st);
  return goalApply(key,st).then(function(){goalsPut(key,st);return msg;});
}
function openGoal(){
  var g=GOALS[gSel],ex=!!goalsMine()[gSel];
  var h='<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>Scheda per un obiettivo</h2><div class="sub">Scegli un movimento: ti guido dal livello più facile fino al traguardo.</div></div>'+closeBtn()+'</div>';
  h+='<div class="chips" style="margin-top:12px">'+Object.keys(GOALS).map(function(k){return '<button type="button" class="chip'+(gSel===k?" on":"")+'" data-gs="'+k+'">'+GOALS[k].ic+' '+esc(GOALS[k].n)+'</button>';}).join("")+'</div>';
  h+='<div class="sub" style="margin-top:10px;color:var(--ink)">Percorso: '+g.lv.map(function(l){return esc(l.n.replace(" (secondi)",""));}).join(" → ")+'</div>';
  h+='<label class="l" style="margin-top:14px">'+esc(g.q)+'</label>';
  if(g.type==="reach") h+='<div class="chips">'+REACH.map(function(r){return '<button type="button" class="chip'+(gReach===r[0]?" on":"")+'" data-gr="'+r[0]+'">'+r[1]+'</button>';}).join("")+'</div>';
  else{
    h+='<input id="g-test" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="0" aria-label="Test iniziale">';
    h+='<label class="l" for="g-target" style="margin-top:14px">Il tuo obiettivo ('+esc(g.unit)+')</label><input id="g-target" type="text" inputmode="numeric" autocomplete="off" maxlength="3" value="'+g.tdef+'">';
  }
  h+='<div class="sub" style="margin-top:10px">Aggiungo alla tua scheda una giornata "Obiettivo '+esc(g.n.toLowerCase())+'": falla 2-3 volte a settimana, con un giorno di pausa in mezzo. Ogni 2-3 settimane rifai il test dalla card in cima alla Scheda.</div>';
  if(ex) h+='<div class="sub" style="margin-top:8px;color:var(--accent)">Hai già questo obiettivo: se continui riparti da capo con un nuovo test.</div>';
  h+='<div class="err" id="g-note"></div><button class="btn full" type="button" data-act="goalmake" style="margin-top:10px">'+(ex?"Ricomincia":"Crea il percorso")+'</button>';
  h+='<div class="sub" style="margin-top:10px">'+DISCL+'</div>';
  openSheet(h);
}
function openGoalTest(key){
  var g=GOALS[key],st=goalsMine()[key],L=g.lv[st.lvl];
  var h='<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>Test: '+esc(g.n)+'</h2><div class="sub">'+(g.type==="reach"?"Dove arrivi con le mani a gambe tese?":"Quante ripetizioni fai ora di «"+esc(L.n.replace(" (secondi)",""))+"»? "+(L.fin?"Il tuo obiettivo è "+st.target+".":"Per passare al livello dopo servono "+L.up+"."))+'</div></div>'+closeBtn()+'</div>';
  if(g.type==="reach") h+='<div class="chips" style="margin-top:12px">'+REACH.map(function(r){return '<button type="button" class="chip'+(gReach===r[0]?" on":"")+'" data-gr="'+r[0]+'" data-gtest="'+key+'">'+r[1]+'</button>';}).join("")+'</div>';
  else h+='<input id="g-test" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="0" style="margin-top:12px" aria-label="Risultato del test">';
  h+='<div class="err" id="g-note"></div><button class="btn full" type="button" data-act="goalsave" data-key="'+key+'" style="margin-top:10px">Salva il test</button>';

}
function timerHTML(){
  return '<div class="tbar" id="tbar" data-state="idle"><div class="tprog"><i id="tprog"></i></div><div class="tlabel" id="tlabel">Pausa</div><div class="tin">'+
    '<button type="button" data-t="60" aria-label="Pausa di 60 secondi">60</button><button type="button" data-t="90" aria-label="Pausa di 90 secondi">90</button><button type="button" data-t="120" aria-label="Pausa di 120 secondi">120</button><button type="button" id="t-stop" hidden>Stop</button></div></div>';
}
function goalOfExercise(name){ // obiettivo attivo il cui esercizio di livello corrente è questo
  var m=goalsMine(),out=null;
  Object.keys(m).forEach(function(k){var g=GOALS[k];if(g&&g.lv[m[k].lvl]&&g.lv[m[k].lvl].n===name) out=k;});
  return out;
}
function goalCardHTML(name){
  var k=goalOfExercise(name);if(!k) return "";
  var g=GOALS[k],st=goalsMine()[k],L=g.lv[st.lvl],last=st.tests[st.tests.length-1];
  var h='<div class="card" style="margin-top:12px"><label class="l">🎯 '+esc(g.n)+' · livello '+(st.lvl+1)+' di '+g.lv.length+'</label>';
  if(g.type==="reach"){
    h+='<div class="sub">Ultimo: '+esc(REACH[Math.max(1,last.v)-1][1])+'. Quando senti di essere arrivato più in là, aggiornalo.</div><button class="btn full" type="button" data-gt="'+k+'" style="margin-top:8px">Aggiorna dove arrivo</button>';
  }else{
    var goalTxt=L.fin?"Il tuo obiettivo è "+st.target+(g.unit==="secondi"?" secondi":"")+".":"Per passare al livello dopo servono "+L.up+(g.unit==="secondi"||/secondi/.test(L.n)?" secondi":"")+".";
    h+='<div class="sub">'+goalTxt+'</div><label class="l" for="g-test" style="margin-top:10px">Quante ne hai fatte nella serie migliore?</label><div class="row" style="flex-wrap:wrap"><input id="g-test" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="0" style="flex:1 1 100px"><button class="btn" type="button" data-act="goalsave" data-key="'+k+'" style="flex:1 1 140px">Salva</button></div><div class="err" id="g-note"></div>';
  }
  return h+'</div>';
}

function imgHTML(name){
  if(MYIMG[name]) return '<div class="card" style="margin-top:10px;padding:10px"><img src="'+MYIMG[name]+'" alt="'+esc(name)+'" style="width:100%;max-height:420px;object-fit:contain;border-radius:10px;display:block;background:var(--bg)"></div>';
  var id=IMGMAP[name];if(!id) return "";
  var st='width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bg);display:block';
  function im(n){return '<img src="'+IMGBASE+id+'/'+n+'.jpg" alt="'+esc(name)+' (foto '+(n+1)+')" loading="lazy" style="'+st+'" onerror="this.parentNode.style.display=\'none\'">';}
  return '<div class="card" style="margin-top:10px;padding:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>'+im(0)+'</div><div>'+im(1)+'</div></div><div class="sub" style="margin:6px 2px 0;font-size:12px">Foto: Free Exercise DB (pubblico dominio)</div></div>';
}
function openDetail(name){
  curEx=name;
  var h=history(S.me,name);
  var first=h[0],last=h[h.length-1];
  var eo=myExObj(name),pr=eo?rx(eo):"";
  var html='<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>'+esc(name)+'</h2>';
  if(pr) html+='<div class="sub" style="margin-top:0">Da fare: '+esc(pr)+'</div>';
  if(h.length>1) html+='<div class="sub">Da '+fmt(first.kg)+' a '+fmt(last.kg)+' kg · '+deltaHTML(last.kg-first.kg)+' dal '+dshort(first.d)+'</div>';
  else if(h.length===1) html+='<div class="sub">Un solo dato per ora.</div>';
  else if(libOf(name)&&libOf(name).eq==="x") html+='<div class="sub">A corpo libero: non serve il peso.</div>';
  else html+='<div class="sub">Ancora nessun dato.</div>';
  html+='</div>'+closeBtn()+'</div>';
  var tp=tipsFor(name),qn=encodeURIComponent(name);
  html+='<div class="row" style="margin-top:10px;flex-wrap:wrap"><a class="btn ghost small" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(name+" esecuzione corretta")+'">▶ Come si fa</a><button class="btn ghost small" type="button" data-act="tips">💡 Consigli</button></div>'+
    imgHTML(name)+'<div class="card" id="tips" hidden style="margin-top:10px"><div style="font-weight:700;margin-bottom:4px">Esecuzione</div><div>'+esc(tp[0])+'</div><div style="font-weight:700;margin:12px 0 4px">Da evitare</div><div>'+esc(tp[1])+'</div>'+
    '<div class="sub" style="margin-top:12px">Sintesi generale scritta per l\'app. Per le guide complete di Project inVictus: <a href="https://www.google.com/search?q='+encodeURIComponent("site:projectinvictus.it "+name+" esecuzione errori comuni")+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">guide</a> · <a href="https://www.youtube.com/results?search_query='+encodeURIComponent("Project inVictus "+name)+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">video</a></div></div>';
  html+='<div class="card" style="margin-top:12px"><label class="l">Serie di oggi</label><div id="srow">'+serieHTML(name)+'</div></div>';
  html+=timerHTML();
  var bw=libOf(name)&&libOf(name).eq==="x";
  if(bw) html+=goalCardHTML(name)||'<div class="card sub" style="margin-top:12px">Esercizio di supporto: a corpo libero, non serve il peso.</div>';
  else{
    var wk=curGet(name)||(last?last.kg:0);
    html+='<div class="card" style="margin-top:12px"><label class="l" for="w-kg">Peso di lavoro</label><div class="sub" style="margin:0 0 8px">Il carico che usi adesso. Cambiarlo non scrive nello storico.</div>'+
      '<div class="row" style="flex-wrap:nowrap"><div class="kgwrap" style="flex:1"><input type="text" inputmode="decimal" id="w-kg" value="'+(wk?esc(fmt(wk)):"")+'" placeholder="0" aria-label="Peso di lavoro in kg"><i>kg</i></div>'+
      '<button class="btn ghost" type="button" data-act="wsave">Salva</button></div><div class="err" id="w-note"></div></div>'+
      '<div class="card" style="margin-top:12px"><label class="l" for="a-kg">Registra allenamento</label>'+
      '<div class="row" style="flex-wrap:wrap"><div class="kgwrap" style="flex:1 1 110px"><input type="text" inputmode="decimal" id="a-kg" value="'+(wk?esc(fmt(wk)):"")+'" placeholder="0" aria-label="Peso in kg"><i>kg</i></div>'+
      '<input type="date" id="a-date" value="'+iso(new Date())+'" style="flex:1 1 150px" aria-label="Data">'+
      '<button class="btn" type="button" data-act="addw" style="flex:1 1 100%">Registra nello storico</button></div>'+
      '<div class="err" id="a-note"></div></div>';
  }
  if(!bw) html+=chartSVG(h);
  h.slice().reverse().forEach(function(x,i,arr){
    var prev=arr[i+1];
    html+='<div class="hist"><div>'+esc(dlabel(x.d))+'</div><div class="row" style="gap:10px"><b>'+fmt(x.kg)+' kg</b>'+(prev?deltaHTML(x.kg-prev.kg):'')+'<button class="x" type="button" data-del="'+esc(x.d)+'" aria-label="Elimina">×</button></div></div>';
  });
  openSheet(html);
  if(tm.state==="run") tick(); else paintTimer(0);
}
function addWeight(){
  var kv=parseFloat(String($("a-kg").value).replace(",","."));
  var dv=$("a-date").value;
  if(!isFinite(kv)||kv<=0){$("a-note").textContent="Scrivi il peso in kg, per esempio 36 o 13,5.";return;}
  if(!dv){$("a-note").textContent="Scegli la data.";return;}
  var nm=curEx;
  closeSheet();
  sendOps([{date:dv,ex:nm,kg:kv}]);
}

/* ====== Sessioni ====== */
var sesMonth=""; // "" = mese più recente, "all" = tutti, altrimenti "AAAA-MM"
var MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function mLabel(m){return MESI[+m.slice(5,7)-1]+" "+m.slice(0,4);}
function renderSes(){
  var by={};
  S.log.filter(function(x){return x.u===S.me;}).forEach(function(x){(by[x.d]=by[x.d]||[]).push(x);});
  var dates=Object.keys(by).sort().reverse();
  if(!dates.length){$("ses-list").innerHTML='<div class="empty">Nessun allenamento salvato.</div>';return;}
  var months=[];dates.forEach(function(d){var m=d.slice(0,7);if(months.indexOf(m)<0)months.push(m);});
  var cur=sesMonth;
  if(cur!=="all"&&months.indexOf(cur)<0) cur=months[0]; // vuoto o mese senza più dati: il più recente
  var shown=cur==="all"?dates:dates.filter(function(d){return d.slice(0,7)===cur;});
  var nEx=0;shown.forEach(function(d){nEx+=by[d].length;});
  var head='<div class="chips" style="margin-bottom:8px">'+months.map(function(m){return '<button type="button" class="chip'+(cur===m?" on":"")+'" data-sm="'+m+'">'+esc(mLabel(m))+'</button>';}).join("")+'<button type="button" class="chip'+(cur==="all"?" on":"")+'" data-sm="all">Tutti</button></div>'+
    '<div class="sub" style="margin-bottom:10px">'+shown.length+(shown.length===1?" allenamento":" allenamenti")+' · '+nEx+(nEx===1?" esercizio":" esercizi")+'</div>';
  $("ses-list").innerHTML=head+shown.map(function(d){
    var list=by[d];
    var pills=list.map(function(x){
      var prev=lastBefore(S.me,x.e,d);

var ARN_L=["Il ferro lo teme.","Ha spostato più acciaio di un trasloco.","La palestra tremava, e non per il wifi.","Arnold chiede l'autografo."];
var DUB_L=["Il ferro ha guardato con rispetto, e basta.","Peso scelto con prudenza: nel dubbio, meno.","Ha sollevato soprattutto dubbi.","Prima o poi aggiungerà un disco. Forse."];
var RAZ_L=["Decollo confermato.","Il carico di ieri oggi gli sembra un giocattolo.","Progressione da manuale.","Questo va forte, tenetelo d'occhio."];
var PRE_L=["La ghisa a colazione, pranzo e cena.","Ha ancora fame: un'altra giornata di ferro.","Alla palestra manca solo il suo nome sulla porta.","Non salta un pasto di ghisa."];
function pickLine(arr,ws,k){return arr[(hashStr(ws+k))%arr.length];}

function computeAwards(ws){
  var we=addDaysIso(ws,6);
  var rows=S.log.filter(function(x){return x.d>=ws&&x.d<=we&&x.kg>0;});
  var users={},byEx={};
  rows.forEach(function(x){
    users[x.u]=1;
    var k=norm(x.e);
    var o=byEx[k]=byEx[k]||{name:x.e,u:{}};
    o.u[x.u]=Math.max(o.u[x.u]||0,x.kg);
  });
  var res={users:Object.keys(users).length,contested:0,arnold:null,dubbi:null,razzo:null,presenza:null};
  var wins={},lasts={},sumKg={};
  Object.keys(byEx).forEach(function(k){
    var o=byEx[k],names=Object.keys(o.u);
    if(names.length<2) return;
    var vals=names.map(function(n){return o.u[n];});
    var tv=Math.max.apply(null,vals),lv=Math.min.apply(null,vals);
    res.contested++;
    names.forEach(function(n){sumKg[n]=(sumKg[n]||0)+o.u[n];});
    if(tv===lv) return;
    names.forEach(function(n){
      if(o.u[n]===tv) wins[n]=(wins[n]||0)+1;
      if(o.u[n]===lv) lasts[n]=(lasts[n]||0)+1;
    });
  });
  function top(map,tie,exclude){
    var best=null,arr=[];
    Object.keys(map).forEach(function(n){
      if(exclude&&exclude.indexOf(n)>-1) return;
      var v=map[n];
      if(best===null||v>best){best=v;arr=[n];}
      else if(v===best) arr.push(n);
    });
    if(!arr.length) return null;
    if(arr.length>1&&tie){
      var bt=null,a2=[];
      arr.forEach(function(n){var t=tie(n);if(bt===null||t>bt){bt=t;a2=[n];}else if(t===bt)a2.push(n);});
      arr=a2;
    }
    return {names:arr,v:best};
  }
  var a=top(wins,function(n){return sumKg[n]||0;});
  if(a) res.arnold={names:a.names,wins:a.v,of:res.contested};
  var dEx=a?a.names:[];
  var d=top(lasts,function(n){return -(sumKg[n]||0);},dEx);
  if(d) res.dubbi={names:d.names,lasts:d.v,of:res.contested};
  // Razzo: maggiore progresso % rispetto al massimo precedente della stessa persona sullo stesso esercizio
  var best=null;
  Object.keys(byEx).forEach(function(k){
    var o=byEx[k];
    Object.keys(o.u).forEach(function(n){
      var prev=0;
      S.log.forEach(function(x){if(x.u===n&&norm(x.e)===k&&x.d<ws&&x.kg>prev) prev=x.kg;});
      if(prev<=0) return;
      var pct=(o.u[n]/prev-1)*100;
      if(pct>=1&&(!best||pct>best.pct||(pct===best.pct&&o.u[n]>best.kg))) best={name:n,ex:o.name,pct:pct,kg:o.u[n]};
    });
  });
  if(best) res.razzo=best;
  // Affamato di ghisa: più giorni di allenamento
  var days={};
  rows.forEach(function(x){(days[x.u]=days[x.u]||{})[x.d]=1;});
  var dm={};
  Object.keys(days).forEach(function(n){dm[n]=Object.keys(days[n]).length;});
  var p=top(dm);
  if(p&&p.v>=2) res.presenza={names:p.names,days:p.v};
  return res;
}
function joinNames(a){return a.length===1?a[0]:a.slice(0,-1).join(", ")+" e "+a[a.length-1]+" (a pari merito)";}
function awardCard(icon,title,crit,winner,detail,fun){
  return '<div class="award"><div class="ah"><div class="ai">'+icon+'</div><div><div class="at">'+title+'</div><div class="as">'+crit+'</div></div></div>'+
    (winner?'<div class="aw">'+esc(winner)+'</div><div class="ad">'+detail+'</div><div class="af">'+esc(fun)+'</div>':
    '<div class="ad" style="margin-top:8px;color:var(--muted)">'+detail+'</div>')+'</div>';
}
function awardsHTML(ws){
  var r=computeAwards(ws);
  var noContest="Servono almeno due persone che fanno lo stesso esercizio.";
  var h="";
  h+=awardCard("🏆","Arnold della settimana","Vince più sfide: chi carica di più sullo stesso esercizio",
    r.arnold?joinNames(r.arnold.names):"",r.arnold?r.arnold.wins+" sfide vinte su "+r.arnold.of:noContest,pickLine(ARN_L,ws,"a"));
  h+=awardCard("🚀","Razzo della settimana","Chi alza di più il carico, in percentuale, rispetto al suo massimo precedente",
    r.razzo?r.razzo.name:"",r.razzo?esc(r.razzo.ex)+": +"+fmt1(r.razzo.pct).replace(",0","")+"% ("+fmt(r.razzo.kg)+" kg)":"Nessun progresso da premiare (serve un massimo precedente).",pickLine(RAZ_L,ws,"r"));
  h+=awardCard("🔩","Affamato di ghisa","Più giorni di allenamento nella settimana",
    r.presenza?joinNames(r.presenza.names):"",r.presenza?r.presenza.days+" giorni in palestra":"Servono almeno 2 giorni di allenamento.",pickLine(PRE_L,ws,"p"));
  h+=awardCard("🤔","Sollevatore di dubbi","Ultimo posto più spesso sullo stesso esercizio (con affetto)",
    r.dubbi?joinNames(r.dubbi.names):"",r.dubbi?r.dubbi.lasts+" volte ultimo su "+r.dubbi.of+" sfide":noContest,pickLine(DUB_L,ws,"d"));
  return h;
}

    });

  });
  html+='<button class="btn ghost full" type="button" data-sc="addg">Aggiungi allenamento</button>'+

function readDraftInputs(){
  if(!draft) return;
  document.querySelectorAll("#v-sc [data-gt]").forEach(function(i){draft[+i.dataset.gt].t=i.value;});
  function ex(attr,key){
    document.querySelectorAll("#v-sc ["+attr+"]").forEach(function(i){
      var p=i.getAttribute(attr).split(".");
      var e=draft[+p[0]]&&draft[+p[0]].ex[+p[1]];
      if(e) e[key]=i.value;
    });
  }
  ex("data-en","n");ex("data-es","s");ex("data-er","r");ex("data-ec","rec");
}
function saveScheda(){
  readDraftInputs();
  var clean=[];
  for(var gi=0;gi<draft.length;gi++){
    var g=draft[gi],ex=[],seen={}; // i doppioni vanno evitati solo nella stessa giornata
    for(var ei=0;ei<g.ex.length;ei++){
      var e=g.ex[ei],n=String(e.n).trim();
      if(!n) continue;
      if(seen[norm(n)]){$("sc-note").textContent="L'esercizio «"+n+"» è ripetuto: i nomi devono essere diversi nella stessa giornata.";return;}
      seen[norm(n)]=1;
      var s=parseInt(e.s,10);if(!(s>0&&s<=12)) s=3;
      var rec=parseInt(e.rec,10);if(!(rec>=0&&rec<=600)) rec=75;
      var r=String(e.r===undefined||e.r===""?"10":e.r).trim().slice(0,12);
      var lb=libOf(n);
      ex.push({id:e.id,n:n,mg:e.mg||(lb?lb.mg:""),lv:e.lv||(lb?lb.lv:2),s:s,r:r,rec:rec});
    }
    if(!String(g.t).trim()&&!ex.length) continue;
    clean.push({id:g.id,t:String(g.t).trim()||"Allenamento",ex:ex});
  }
  var old={};
  mySchedaObj().forEach(function(g){g.ex.forEach(function(e){old[e.id]=e.n;});});
  var renames=[];
  clean.forEach(function(g){g.ex.forEach(function(e){if(old[e.id]&&old[e.id]!==e.n) renames.push({from:old[e.id],to:e.n});});});
  $("sc-note").textContent="Salvo…";
  saveMyScheda(clean,renames).then(function(){
    draft=null;clearDraft();
    setTab("ex");
    setStatus("Scheda salvata.");
  }).catch(function(e){$("sc-note").textContent="Non salvata: "+e.message;});
}

function wzNames(){
  var m={};
  (wzOut||[]).forEach(function(g){g.ex.forEach(function(e){m[norm(e.n)]=1;});});

}
function swapWizEx(gi,ei){
  var day=wzOut[gi],cur=day&&day.ex[ei];
  if(!cur) return false;
  setCtx(wz);
  var used=wzNames(),post=/posteriori|Reverse|Face/.test(cur.n);
  function pool(strictAtt,strictLv){
    return LIB.filter(function(e){
      if(e.mg!==cur.mg||used[norm(e.n)]||exOut(e)) return false;
      if(/posteriori|Reverse|Face/.test(e.n)!==post) return false;
      if(strictAtt&&!eqOk(e,wz.att)) return false;
      if(strictLv&&wz.liv==="principiante"&&e.lv>2) return false;
      return true;
    });
  }
  var c=pool(true,true);
  if(!c.length) c=pool(true,false);
  if(!c.length) return false;
  var e=c[Math.floor(Math.random()*c.length)],pr=presc(e,wz.liv,wz.obi,wz.stile);
  day.ex[ei]={id:uid(),n:e.n,mg:e.mg,lv:e.lv,s:pr.s,r:pr.r,rec:pr.rec};
  return true;
}
function regenKeepLocks(){
  var old=wzOut,nw=genScheda(wz);
  if(old) nw.forEach(function(g,gi){
    if(!old[gi]) return;
    g.ex.forEach(function(e,ei){var o=old[gi].ex[ei];if(o&&o.lk) g.ex[ei]=o;});
  });
  wzOut=nw;
  // se un esercizio non bloccato ripete uno bloccato (o un altro), lo cambio
  var seen={};
  wzOut.forEach(function(g){g.ex.forEach(function(e){if(e.lk) seen[norm(e.n)]=1;});});
  wzOut.forEach(function(g,gi){g.ex.forEach(function(e,ei){
    if(e.lk) return;
    if(seen[norm(e.n)]){
      swapWizEx(gi,ei);
    }
    seen[norm(g.ex[ei].n)]=1;
  });});
}

var tm={end:0,total:0,iv:null,state:"idle"};
var actx=null;
function audioCtx(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){
  try{
    audioCtx();if(!actx)return;
    [0,0.3,0.6].forEach(function(t){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=880;g.gain.value=0.25;
      o.connect(g);g.connect(actx.destination);
      o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.18);
    });
  }catch(e){}
}
function paintTimer(left){
  var bar=$("tbar"),lab=$("tlabel");
  if(!bar||!lab) return; // timer visibile solo dentro un esercizio
  bar.setAttribute("data-state",tm.state);
  bar.querySelectorAll("[data-t]").forEach(function(b){b.classList.toggle("on",tm.state==="run"&&+b.dataset.t===tm.total);});
  $("t-stop").hidden=(tm.state==="idle");
  $("t-stop").textContent=tm.state==="done"?"Ok":"Stop";
  if(tm.state==="idle"){lab.innerHTML="Pausa";$("tprog").style.width="0";}
  else if(tm.state==="done"){lab.innerHTML="Via!";$("tprog").style.width="0";}
  else{lab.innerHTML=left+'<small>sec</small>';$("tprog").style.width=Math.max(0,Math.min(100,(left/tm.total)*100))+"%";}
}
function tick(){
  var ms=tm.end-Date.now(),left=Math.ceil(ms/1000);
  if(left<=0){
    clearInterval(tm.iv);tm.iv=null;tm.state="done";paintTimer(0);
    if(ms>-3000)beep();
    return;
  }
  paintTimer(left);
}
function startTimer(s){
  audioCtx();clearInterval(tm.iv);
  tm.total=s;tm.end=Date.now()+s*1000;tm.state="run";
  tick();tm.iv=setInterval(tick,250);
}
function stopTimer(){clearInterval(tm.iv);tm.iv=null;tm.state="idle";paintTimer(0);}

$("v-fr").addEventListener("click",function(e){
  var m=e.target.closest("[data-fr]");
  if(m){frMode=m.dataset.fr;renderFriends();return;}
  var u=e.target.closest("[data-user]");
  if(u)openFriend(u.dataset.user);
});
$("v-fr").addEventListener("change",function(e){if(e.target.id==="fr-ex"){frEx=e.target.value;renderFriends();}});

$("v-sc").addEventListener("input",function(){readDraftInputs();persistDraft();});
$("v-sc").addEventListener("click",function(e){
  var t=e.target,b;
  if((b=t.closest("[data-gmv]"))){readDraftInputs();var q=b.dataset.gmv.split("."),a=+q[0],d=+q[1]||-1;if(b.dataset.gmv.indexOf(".-1")>-1)d=-1;var c=a+d;if(c>=0&&c<draft.length){var tm=draft[a];draft[a]=draft[c];draft[c]=tm;}renderScheda();return;}
  if((b=t.closest("[data-emv]"))){readDraftInputs();var r=b.dataset.emv.split("."),gi2=+r[0],ei2=+r[1],dd=b.dataset.emv.slice(-2)==="-1"?-1:1,ce=ei2+dd,L=draft[gi2].ex;if(ce>=0&&ce<L.length){var te=L[ei2];L[ei2]=L[ce];L[ce]=te;}renderScheda();return;}
  if((b=t.closest("[data-gdel]"))){readDraftInputs();draft.splice(+b.dataset.gdel,1);renderScheda();return;}
  if((b=t.closest("[data-edel]"))){readDraftInputs();var p=b.dataset.edel.split(".");draft[+p[0]].ex.splice(+p[1],1);renderScheda();return;}
  if((b=t.closest("[data-eadd]"))){readDraftInputs();openPicker(+b.dataset.eadd);return;}
  if((b=t.closest("[data-sc]"))){
    var a=b.dataset.sc;
    if(a==="addg"){readDraftInputs();draft.push({id:uid(),t:"",ex:[]});renderScheda();}
    if(a==="save")saveScheda();
    if(a==="reset"){draft=null;clearDraft();backConfirm=false;renderScheda();}
    if(a==="back"){
      readDraftInputs();
      var dirty=schedaSig(draft)!==schedaSig(mySchedaObj());
      if(dirty&&!backConfirm){backConfirm=true;renderScheda();return;}
      backConfirm=false;draft=null;clearDraft();setTab("ex");
    }
  }
});

$("ov").addEventListener("click",function(e){
  var t=e.target,b;
  if(t===$("ov")) return closeSheet();
  if((b=t.closest("[data-act]"))){
    var a=b.dataset.act;
    if(a==="close") return closeSheet();
    if(a==="addw") return addWeight();
    if(a==="wsave"){
      var wv=parseFloat(String($("w-kg").value).replace(",","."));
      if(!isFinite(wv)||wv<=0){$("w-note").textContent="Scrivi il peso in kg, per esempio 36 o 13,5.";return;}
      curSet(curEx,wv);$("a-kg").value=fmt(wv);renderAll();
      $("w-note").style.color="var(--up)";$("w-note").textContent="Peso di lavoro salvato.";
      return;
    }
    if(a==="tips"){var tpn=$("tips");if(tpn)tpn.hidden=!tpn.hidden;return;}
    if(a==="ssave") return saveSession();
    if(a==="sdel"){
      if(!sedit.confirmDel){sedit.confirmDel=true;renderSessionSheet();return;}
      sedit.rows=[];return saveSession();
    }
    if(a==="copy"){
      if(!cpConfirm){cpConfirm=true;openFriend(curFriend);return;}
      return copyFriendScheda();
    }
    if(a==="pkcustom") return addCustom();
    if(a==="ibtoggle"){wzIB.open=!wzIB.open;return renderWizard();}
    if(a==="ibapply") return applyIB();
    if(a==="profsave"){var pe2=$("p-eta");profDraft.eta=pe2?pe2.value.replace(/\D/g,""):profDraft.eta;profSave(profDraft);profDraft=null;openSettings();setStatus("Profilo salvato.");return;}
    if(a==="wzadv"){wz.adv=!wz.adv;return renderWizard();}
    if(a==="radd"){
      var pr=ROUTINES.filter(function(r){return r.k===b.dataset.k;})[0];if(!pr) return;
      var sch=cloneScheda(mySchedaObj());
      sch.push({id:uid(),t:pr.t,ex:pr.ex.map(function(x){return {id:uid(),n:x[0],mg:x[1],s:+x[2],r:x[3],rec:30};})});
      saveMyScheda(sch,[]).then(function(){draft=null;renderAll();renderWizard();setStatus("Routine aggiunta alla Scheda.");}).catch(function(er){setStatus("Non salvata: "+er.message);});
      return;
    }
    if(a==="goalopen"){gSel=gSel||"push";return openGoal();}
    if(a==="goalmake"){
      var gk=gSel,gg=GOALS[gk],v,tg=gg.tdef;
      if(gg.type==="reach") v=gReach;
      else{
        v=parseInt(String($("g-test").value).trim()||"",10);tg=parseInt(String($("g-target").value).trim()||"",10);
        if(!isFinite(v)||v<0){$("g-note").textContent="Scrivi il risultato del test (anche 0).";return;}
        if(!isFinite(tg)||tg<=0||tg<=v){$("g-note").textContent="L'obiettivo deve essere più alto del tuo risultato di oggi.";return;}
      }
      var gst=goalStart(gk,v,tg);
      setStatus("Creo il percorso…");
      return goalApply(gk,gst).then(function(){goalsPut(gk,gst);var sc=mySchedaObj();closeSheet();setTab("ex");openG[gst.dayId]=true;renderAll();setStatus("Percorso creato: "+gg.lv[gst.lvl].n+".");}).catch(function(err){setStatus("Non salvato: "+err.message);});
    }
    if(a==="goalsave"){
      var k2=b.dataset.key,g2=GOALS[k2],v2;
      if(g2.type==="reach") v2=gReach;
      else{v2=parseInt(String($("g-test").value).trim()||"",10);if(!isFinite(v2)||v2<0){$("g-note").textContent="Scrivi il risultato del test.";return;}}
      return goalRetest(k2,v2).then(function(msg){closeSheet();renderAll();setStatus(msg);}).catch(function(err){$("g-note").textContent="Non salvato: "+err.message;});
    }
    if(a==="goalrm"){var k3=b.dataset.key;goalsPut(k3,null);closeSheet();renderAll();setStatus("Obiettivo rimosso (la giornata resta nella scheda).");return;}
    if(a==="gymoff"){wz.gymOn=false;return renderWizard();}
    if(a==="gymon"){wz.gymOn=true;return renderWizard();}
    if(a==="wzgo"){wzOut=genScheda(wz);useConfirm=false;return renderWizard();}
    if(a==="wzregen"){regenKeepLocks();useConfirm=false;return renderWizard();}
    if(a==="wzsw"||a==="wzlk"){
      var kk=b.dataset.k.split("."),gi2=+kk[0],ei2=+kk[1];
      if(a==="wzlk"&&wzOut[gi2]&&wzOut[gi2].ex[ei2]) wzOut[gi2].ex[ei2].lk=!wzOut[gi2].ex[ei2].lk;
      var okSw=true;
      if(a==="wzsw") okSw=swapWizEx(gi2,ei2);
      useConfirm=false;renderWizard();
      if(!okSw&&$("wz-note")) $("wz-note").textContent="Non ho altre alternative per questo esercizio con le tue risposte.";
      return;
    }
    if(a==="wzback"){wzOut=null;useConfirm=false;return renderWizard();}
    if(a==="wzuse") return useWizardScheda();
  }
  if((b=t.closest("[data-gt]"))){openGoalTest(b.dataset.gt);return;}
  if((b=t.closest("[data-gs]"))){gSel=b.dataset.gs;openGoal();return;}
  if((b=t.closest("[data-gr]"))){gReach=+b.dataset.gr;if(b.dataset.gtest)openGoalTest(b.dataset.gtest);else openGoal();return;}
  if((b=t.closest("[data-set]"))){if(b.dataset.set==="gym")openGym();if(b.dataset.set==="prof"){profDraft=null;openProf();}return;}
  if((b=t.closest("[data-pz]"))&&profDraft){var pe=$("p-eta");if(pe)profDraft.eta=pe.value.replace(/\D/g,"");var zi=profDraft.inf.indexOf(b.dataset.pz);if(zi>-1)profDraft.inf.splice(zi,1);else profDraft.inf.push(b.dataset.pz);return openProf();}
  if((b=t.closest("[data-gk]"))&&gymDraft){var gi2=gymDraft.indexOf(b.dataset.gk);if(gi2>-1)gymDraft.splice(gi2,1);else gymDraft.push(b.dataset.gk);return renderGym();}
  if((b=t.closest("[data-gact]"))&&gymDraft){return gymAct(b.dataset.gact);}
  if((b=t.closest("[data-sr]"))&&curEx){setSerie(curEx,+b.dataset.sr);return;}
  if((b=t.closest("[data-wz]"))&&wz){
    var kv=b.dataset.wz.split(":"),k=kv[0],v=kv[1];
    if(k==="att"){
      var ix=wz.att.indexOf(v);
      if(ix>-1){if(wz.att.length>1) wz.att.splice(ix,1);} // almeno un attrezzo resta sempre scelto
      else wz.att.push(v);
    }else if(k==="inf"){
      var ij=wz.inf.indexOf(v);
      if(ij>-1) wz.inf.splice(ij,1); else wz.inf.push(v);
    }else wz[k]=(k==="giorni"||k==="durata")?+v:v;
    return renderWizard();
  }
  if((b=t.closest("[data-pick]"))&&pk){addPicked(LIB[+b.dataset.pick]);return;}
  if((b=t.closest("[data-pmg]"))&&pk){pk.mg=b.dataset.pmg;renderPicker();return;}
  if((b=t.closest("[data-del]"))){
    var nm=curEx,d=b.dataset.del;
    closeSheet();
    sendOps([{date:d,ex:nm,kg:null}]);
    return;
  }
  if((b=t.closest("[data-srm]"))&&sedit){
    var keep=$("s-date").value;sedit.rows.splice(+b.dataset.srm,1);renderSessionSheet();$("s-date").value=keep;
  }
});
$("ov").addEventListener("input",function(e){
  if(pk&&e.target.id==="pk-q"){pk.q=e.target.value;renderPicker();}
  if(wz&&e.target.id&&e.target.id.indexOf("ib-")===0) wzIB.vals[e.target.id]=e.target.value;
});
$("ov").addEventListener("change",function(e){
  var t=e.target;
  if(sedit&&t.id==="s-date"){renderSessionSheet();return;}
  if(sedit&&t.dataset&&t.dataset.sk!==undefined){
    var v=parseFloat(String(t.value).replace(",","."));
    if(isFinite(v)&&v>0) sedit.rows[+t.dataset.sk].kg=v;
  }
});
$("ov").addEventListener("focusin",function(e){if(e.target&&e.target.id==="a-kg"){try{e.target.select();}catch(x){}}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("ov").hidden)closeSheet();});

$("ov").addEventListener("click",function(e){
  var b=e.target.closest("[data-t]");
  if(b&&b.closest("#tbar"))return startTimer(+b.dataset.t);
  if(e.target.id==="t-stop")stopTimer();
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden)return;
  if(tm.state==="run")tick();
  if(S.token&&Date.now()-lastSync>30000)loadState();
});

/* ====== Avvio ====== */
var tok=lsGet("dpc-token");
if(tok){
  S.token=tok;
  try{
    var c=JSON.parse(lsGet("dpc-cache")||"null");
    if(c){applyState({me:c.me,users:c.users,log:c.log});}
  }catch(e){}
  showApp();renderAll();
  loadState();
}else{
  showAuth();
}

/* Per i test automatici */
window.__crew={S:S,genScheda:genScheda,schedaStats:schedaStats,computeAwards:computeAwards,weekStart:weekStart,LIB:LIB};
})();
</script>
